const isFi=()=>!!(S.gen&&S.gen.ui==='fi');
function trText(v){
  const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(v);if(!m||!m[2])return v;
  const core=m[2].replace(/ /g,' ').replace(/\s+/g,' ');
  const one=c=>{if(Object.prototype.hasOwnProperty.call(FI,c))return FI[c];for(const [re,fn] of FI_RX){const mm=re.exec(c);if(mm){const x=fn(mm);if(x!==undefined)return x}}};
  let r=one(core);
  if(r===undefined){
    const parts=core.split(/(?<=[.!?])\s+/);
    if(parts.length>1){let hit=false;const out=parts.map(p=>{const x=one(p);if(x===undefined)return p;hit=true;return x});if(hit)r=out.join(' ')}
  }
  return r===undefined?v:m[1]+r+m[3];
}

const ATTRS=['placeholder','aria-label','title','alt'];
function xlNode(n){
  if(n.nodeType===3){
    const p=n.parentNode;if(!p||p.closest&&p.closest('[data-notr],script,style,textarea'))return;
    const nv=trText(n.nodeValue);if(nv!==n.nodeValue)n.nodeValue=nv;return;
  }
  if(n.nodeType!==1)return;
  if(n.closest('[data-notr],script,style,textarea'))return;
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,{acceptNode(t){const p=t.parentNode;return p&&p.closest&&p.closest('[data-notr],script,style,textarea')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  let t;while((t=w.nextNode())){const nv=trText(t.nodeValue);if(nv!==t.nodeValue)t.nodeValue=nv}
  const els=[n,...n.querySelectorAll('[placeholder],[aria-label],[title],[alt]')];
  els.forEach(e=>{if(e.closest('[data-notr]'))return;ATTRS.forEach(a=>{if(e.hasAttribute&&e.hasAttribute(a)){const o=e.getAttribute(a),nv=trText(o);if(nv!==o)e.setAttribute(a,nv)}})});
}

function startI18n(){
  if(xlObs||!document.body)return;
  xlObs=new MutationObserver(recs=>{
    if(!isFi()||xlBusy)return;xlBusy=true;
    try{recs.forEach(r=>{
      if(r.type==='childList')r.addedNodes.forEach(xlNode);
      else if(r.type==='characterData')xlNode(r.target);
      else if(r.type==='attributes')xlNode(r.target);
    })}finally{xlBusy=false}
    xlObs.takeRecords();
  });
  xlObs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTRS});

  b.innerHTML=S.queue.length?`<h2>Importing</h2><div class="list queue">${S.queue.slice(0,6).map(q=>{const pc=q.state==='done'?100:Math.max(4,Math.min(99,Math.round(q.pct||0)));const C=56.55,busy=q.state!=='done'&&q.state!=='error'&&!q.none;return `<div class="q ${q.state}${q.warn?' warn':''}${q.out?' out':''}"><span class="qn"><svg class="ring${busy?' spin':''}" ${busy?`style="animation-delay:-${Date.now()%900}ms"`:''} viewBox="0 0 24 24" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pc}" aria-label="Progress"><circle class="rt" cx="12" cy="12" r="9"/><circle class="rp" cx="12" cy="12" r="9" stroke-dasharray="${C}" stroke-dashoffset="${busy?(C*0.7).toFixed(2):(C*(1-pc/100)).toFixed(2)}" transform="rotate(-90 12 12)"/>${q.state==='done'&&!q.none?'<path class="rc" d="M8 12.5l3 3 5-6"/>':(q.state==='error'||q.none)?'<path class="rc" d="M12 8v5M12 16v.5"/>':''}</svg><span class="qt">${esc(q.name)}</span></span>${q.sup?`<span class="qm"><span class="qs">${esc(q.sup)}</span><span class="qa"> · ${esc(q.amt)}</span></span>`:`<span class="qm"><span class="qs">${esc(q.msg)}</span></span>`}${(q.state==='error'||q.warn)?`<button class="qx" data-act="qDel" data-qid="${q.id}" aria-label="Dismiss"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`:''}</div>`}).join('')}</div>`:'';
}

const CLI_SORTS=[['az','Name A–Z'],['za','Name Z–A'],['sales','Sales, high to low'],['saleslo','Sales, low to high'],['recent','Latest invoice']];
const cliSales=c=>isProj()?S.receipts.filter(r=>r.clientId===c.id&&r.status==='ok').reduce((t,r)=>t+recExp(r).gross,0):S.invoices.filter(i=>i.clientId===c.id&&i.status!=='draft').reduce((t,i)=>t+invTotals(i).net,0);
const CON_SORTS=[['az','Name A–Z'],['za','Name Z–A'],['sales','Costs, high to low'],['saleslo','Costs, low to high']];
function cliHay(c){return NORM([c.name,c.businessId,c.street,c.zip,c.city,c.email,c.phone,c.notes,amtTxt(cliSales(c))].join(' | '))}
function cliList(){
  const q=NORM(S.q.cli).trim(),so=S.sort.cli;
  let list=S.clients.slice();
  if(q)list=list.filter(c=>q.split(/\s+/).every(w=>cliHay(c).includes(w)));
  const last=c=>S.invoices.filter(i=>i.clientId===c.id).reduce((m,i)=>Math.max(m,i.number||0),0);
  const nm=(a,b)=>(a.name||'').localeCompare(b.name||'','fi');
  list.sort(so==='za'?(a,b)=>nm(b,a):so==='sales'?(a,b)=>cliSales(b)-cliSales(a)||nm(a,b):so==='saleslo'?(a,b)=>cliSales(a)-cliSales(b)||nm(a,b):so==='recent'?(a,b)=>last(b)-last(a)||nm(a,b):nm);
  return list.length?`<div class="list">${list.map(c=>`<button class="row" data-act="openCli" data-id="${c.id}"><div class="l"><div class="t">${esc(c.name)}</div><div class="s">${esc([c.street,c.city].filter(Boolean).join(', ')||c.email||'No address yet')}</div></div><div class="r sales"><div class="mono">${money(cliSales(c))}</div><div class="small muted">${cw('Sales total','Costs total')}</div></div></button>`).join('')}</div>`
  :S.clients.length?`<div class="empty"><strong>No matches</strong>Try a different search.</div>`
  :isProj()?`<div class="empty"><strong>No contractors yet</strong>Add the companies and people working on your project.<div style="margin-top:12px"><button class="btn primary" data-act="newCli">New contractor</button></div></div>`
  :`<div class="empty"><strong>No clients yet</strong>Start growing your business by adding your first client.<div style="margin-top:12px"><button class="btn primary" data-act="newCli">New client</button></div></div>`;
}

function subSection(){
  const B=window.kuititon&&window.kuititon.billing;if(!B)return '';
  const i=B.info();
  const dt=ms=>ms?dateFi(new Date(ms).toISOString().slice(0,10)):'';

  let st='',btn='';
  if(S.gen.sub){
    const p=S.gen.sub==='project'?'projects':'business';
    if(i.hasSubscription){
      st=`<div class="notice info"><b>${planName(p)}</b> · ${i.interval==='year'?L('yearly','vuosilasku'):L('monthly','kuukausilasku')}<br>${i.cancelAtEnd?L('Subscription ends on '+dt(i.periodEnd)+'.','Tilaus päättyy '+dt(i.periodEnd)+'.'):L('Renews on '+dt(i.periodEnd)+'.','Uusiutuu '+dt(i.periodEnd)+'.')}</div>`;

function placeSeg(from,root){
  const R=root||document,pill=R.querySelector('.seg .seg-pill'),cur=R.querySelector('.seg button[aria-pressed=true]');
  if(!pill||!cur)return;
  if(from){pill.style.transition='none';pill.style.width=from.w+'px';pill.style.transform='translateX('+from.x+'px)';void pill.offsetWidth;pill.style.transition=''}
  else pill.style.transition='none';
  pill.style.width=cur.offsetWidth+'px';pill.style.transform='translateX('+cur.offsetLeft+'px)';
  if(!from){void pill.offsetWidth;pill.style.transition=''}
}

const LEAVE_KEY='innotate-books-noleave';let leaveSkip=false;
/* asks before going back from an editor with unsaved changes (can be switched off with "Don't show this again") */
function guardLeave(sh,isDirty,o){
  sh.guard=()=>{
    if(!o){
      if(!isDirty())return false;
      let skip=leaveSkip;try{skip=skip||localStorage.getItem(LEAVE_KEY)==='1'}catch(e){}
      if(skip)return false;
    }
    if(sh.el.querySelector('[data-lvwrap]'))return true;
    const w=document.createElement('div');w.className='modal-wrap';w.setAttribute('data-lvwrap','1');
    w.innerHTML=`<div class="modal-bg" data-lv="no"></div><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="lvT"><h3 id="lvT">${o?o.title:'Discard changes?'}</h3><p>${o?o.text:'You have changes that are not saved. If you go back now, they will be lost.'}</p>${o?'':`<label style="display:flex;align-items:center;gap:10px;margin:0 0 14px;cursor:pointer"><input type="checkbox" class="ick" id="lvSkip" style="margin:0"><span>Don't show this again</span></label>`}<div class="actions"><button class="btn dlg-del" data-lv="yes">${o?o.yes:'Discard changes'}</button><button class="btn" data-lv="no">Keep editing</button></div></div>`;
    sh.el.appendChild(w);
    w.addEventListener('click',e=>{const b=e.target.closest('[data-lv]');if(!b)return;e.stopPropagation();
      if(b.dataset.lv==='yes'){if(w.querySelector('#lvSkip')&&w.querySelector('#lvSkip').checked){leaveSkip=true;try{localStorage.setItem(LEAVE_KEY,'1')}catch(x){}}closeSheet()}else w.remove()});
    return true;
  };
}

/* keep an open search dropdown above the on-screen keyboard (iOS keeps the layout viewport, so scroll the sheet and cap the panel height) */
function kbFit(btn,pn){
  const vv=window.visualViewport,sh=btn&&btn.closest('.sheet');if(!sh||!pn)return;
  const inp=pn.querySelector('input'),touch=matchMedia('(pointer:coarse)').matches;
  const vh=()=>vv?vv.height:window.innerHeight;
  const fit=()=>{
    if(!pn.isConnected){if(vv)vv.removeEventListener('resize',fit);sh.style.paddingBottom='';return}
    /* some in-app webviews never report the keyboard, so on touch screens assume one while the search box has focus */
    let kb=vv?Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop)):0;
    if(!kb&&touch&&inp&&document.activeElement===inp)kb=Math.min(340,Math.round(window.innerHeight*.42));
    sh.style.paddingBottom='';
    if(!kb){pn.style.maxHeight='';return}
    const tp=sh.querySelector('.sheet-top'),th=tp?tp.offsetHeight:60;
    /* add only as much extra room as needed to lift the field under the header, so the sheet can't be scrolled further */
    const d=btn.getBoundingClientRect().top-th-8,need=d-(sh.scrollHeight-sh.clientHeight-sh.scrollTop);
    if(need>0)sh.style.paddingBottom=Math.ceil(need)+'px';
    sh.scrollTop+=d;
    const top=pn.getBoundingClientRect().top,room=(vv&&window.innerHeight-vv.height>40?vh():window.innerHeight-kb);
    pn.style.maxHeight=Math.min(380,Math.max(150,room-top-10))+'px';
  };
  if(vv)vv.addEventListener('resize',fit);if(inp)inp.addEventListener('blur',()=>setTimeout(fit,50));fit();setTimeout(fit,120);setTimeout(fit,380);
}

    if(a.dataset.act==='cSortPick'){const k=a.dataset.k,v=a.dataset.v;cs[k]=v;const m=root.querySelector('#cSortMenu');if(m){m.hidden=true;m.querySelectorAll('.si').forEach(x=>{const on=x.dataset.v===v;x.classList.toggle('on',on);x.setAttribute('aria-checked',String(on))})}const bt=root.querySelector('.sortbtn');if(bt){bt.classList.toggle('on',v!=='new');bt.setAttribute('aria-expanded','false')}const b=root.querySelector('#cList');if(b)b.innerHTML=cListHtml(k);return}
    if(a.dataset.act==='cSelMode'){const sm=root.querySelector('#cSortMenu');if(sm){sm.hidden=true;const sb=root.querySelector('[data-act=cSortToggle]');if(sb)sb.setAttribute('aria-expanded','false')}selMode=!selMode;if(!selMode)sel.clear();a.setAttribute('aria-pressed',String(selMode));cRefresh();return}
    if(a.dataset.act==='cSelExit'){selMode=false;sel.clear();const bt=root.querySelector('[data-act=cSelMode]');if(bt)bt.setAttribute('aria-pressed','false');cRefresh();return}
    if(a.dataset.act==='cSel'){const id=a.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);cRefresh();return}
    if(a.dataset.act==='cSelAll'){const all=lastVis.length&&lastVis.every(x=>sel.has(x));lastVis.forEach(x=>all?sel.delete(x):sel.add(x));cRefresh();return}
    if(a.dataset.act==='cSelDl'){if(sel.size)downloadPdfs('rec',new Set(sel));return}
    if(a.dataset.act==='cSelDel'){if(!sel.size)return;askBulk=true;sh.el.querySelector('.sheet-body').innerHTML=body();return}
    if(a.dataset.act==='cBulkNo'){askBulk=false;sh.el.querySelector('.sheet-body').innerHTML=body();return}
    if(a.dataset.act==='cBulkYes'){
      const rs=S.receipts.filter(x=>sel.has(x.id)&&!x.billedInvoiceId);
      const orig=rs.map(clone),ids=[];
      for(const x of rs){await drop('receipts',x.id);ids.push(x.imageId,x.pdfId)}
      askBulk=false;selReset();sh.el.querySelector('.sheet-body').innerHTML=body();
      offerAction(rs.length+' receipt'+(rs.length===1?'':'s')+' deleted','Undo',async()=>{for(const o of orig)await save('receipts',o);toast('Restored')},()=>dropAssets(ids));return}
    if(a.dataset.act==='openInv'){showInvoice(a.dataset.id);return}
    if(a.dataset.act==='openRec'){openReceipt(a.dataset.id);return}
    if(a.dataset.act==='cliSave'){
      if(!c.name.trim()){toast('Enter a name');return}
      c.name=c.name.trim();await save('clients',c);
      if(!isNew){ctab='cards';sh.live=true;sh.el.querySelector('.sheet-top h3').textContent=c.name;sh.el.querySelector('.sheet-body').innerHTML=body();sh.el.scrollTo(0,0);toast(cw('Client saved','Contractor saved'));return}
      closeSheet();if(cb)cb(c.id);
    }
    if(a.dataset.act==='cliAskDel'){askDel=true;sh.el.querySelector('.sheet-body').innerHTML=body();sh.el.scrollTo(0,0)}
    if(a.dataset.act==='cliDelNo'){askDel=false;sh.el.querySelector('.sheet-body').innerHTML=body()}
    if(a.dataset.act==='cliDelYes'){
      if(S.invoices.some(i=>i.clientId===c.id)){askDel=true;sh.el.querySelector('.sheet-body').innerHTML=body();return}
      const origCli=clone(S.clients.find(x=>x.id===c.id)||c),origRec=S.receipts.filter(x=>x.clientId===c.id).map(clone);
      for(const x of S.receipts.filter(x=>x.clientId===c.id))await save('receipts',{...x,clientId:''});
      await drop('clients',c.id);closeSheet();
      offerAction(cw('Client deleted','Contractor deleted'),'Undo',async()=>{await save('clients',origCli);for(const o of origRec)await save('receipts',o);toast('Restored')});
    }
    if(a.dataset.act==='cliNewInv'){openInvoiceEditor(null,c.id);return}
    if(a.dataset.act==='cliNewRec'){const nr=blankReceipt();nr.clientId=c.id;nr.status='ok';openReceipt(null,nr);return}
  });
}

/* ---------- invoice editor ---------- */
const TERMS=[7,14,30];
const termOpts=n=>TERMS.concat(TERMS.includes(n)||!(n>=0)?[]:[n]).sort((a,b)=>a-b).map(d=>`<option value="${d}" ${d===n?'selected':''}>${d} days</option>`).join('');
function blankLine(){return {desc:'',qty:1,unit:unitNames()[0]||'h',unitCents:0,vatRate:+S.settings.defVat||25.5}}
function openInvoiceEditor(id,preClient,tpl){

  const TRASH_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',CHECK_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',PEN_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
  const termDays=()=>Math.max(0,Math.round((new Date(inv.dueDate+'T12:00:00')-new Date(inv.issueDate+'T12:00:00'))/864e5)||0);
  const lineForm=(l,i)=>`<div class="line" data-i="${i}"><div class="line-head"><span class="lab">Line ${i+1}${l.receiptId?' · from receipt':''}</span><span class="dbt"><button class="btn sm ur okb" data-act="lnDone" data-i="${i}" aria-label="Done editing line ${i+1}">${CHECK_SVG}</button>${inv.lines.length>1?`<button class="btn sm trash" data-act="lnDel" data-i="${i}" aria-label="Remove line ${i+1}">${TRASH_SVG}</button>`:''}</span></div>
    <textarea data-l="desc" data-i="${i}" placeholder="What was done or supplied" rows="2" style="min-height:56px">${esc(l.desc)}</textarea>
    <div class="grid2">

      <div class="f"><label>Unit price (€)</label><input data-l="price" data-i="${i}" inputmode="decimal" value="${esc(inputMoney(l.unitCents))}" placeholder="0,00"><span class="small muted">Price excl. VAT</span></div>
      <div class="f"><label>VAT</label><select data-l="vat" data-i="${i}">${VATS.map(v=>`<option value="${v}" ${+l.vatRate===v?'selected':''}>${fmtRate(v)} %</option>`).join('')}</select></div>
    </div></div>`;
  const lineDone=(l,i)=>`<div class="line done" data-i="${i}"><div class="dn"><div class="dt">${esc((l.desc||'').trim())||'<span class="muted">No description</span>'}<div class="small muted">${String(l.qty).replace('.',',')} ${esc(l.unit)} × ${num(l.unitCents)} € · ${fmtRate(l.vatRate)} % VAT${l.receiptId?' · from receipt':''}</div></div><div class="mono dam">${num(Math.round(l.qty*l.unitCents))} €</div></div><div class="dbt"><button class="btn sm ur" data-act="lnEdit" data-i="${i}" aria-label="Edit line ${i+1}">${PEN_SVG}</button>${inv.lines.length>1?`<button class="btn sm trash" data-act="lnDel" data-i="${i}" aria-label="Remove line ${i+1}">${TRASH_SVG}</button>`:''}</div></div>`;
  const lineHtml=(l,i)=>editing.has(l)?lineForm(l,i):lineDone(l,i);
  const hasContent=l=>(l.desc||'').trim()||l.unitCents>0;
  const foldOthers=keep=>{inv.lines.forEach(l=>{if(l!==keep&&hasContent(l))editing.delete(l)})};
  const totalsHtml=()=>{const t=calc(inv.lines);return `<ul class="ledger"><li><span>Total before VAT</span><span class="lead"></span><span class="val">${money(t.net)}</span></li>${t.groups.map(g=>`<li><span>VAT ${fmtRate(g.rate)} %</span><span class="lead"></span><span class="val">${money(g.vat)}</span></li>`).join('')}<li class="total"><span><strong>To pay</strong></span><span class="lead"></span><span class="val"><strong>${money(t.gross)}</strong></span></li><li><span class="muted">Due date</span><span class="lead"></span><span class="val muted" id="e_dueTxt">${dateFi(inv.dueDate)}</span></li></ul>`};
  const pickHtml=()=>{

    if(!inv.clientId)return `<p class="small muted">Choose a client first.</p>`;

    return `<div class="list">${avail.map(r=>`<label class="pick"><input type="checkbox" data-pick="${r.id}"><span style="flex:1;min-width:0"><span style="display:block;font-weight:500">${esc(r.supplier||'Receipt')}</span><span class="small muted">${dateFi(r.date)}</span></span><span class="mono">${money(recBillLines(r).reduce((t,l)=>t+l.unitCents,0))}</span></label>`).join('')}</div><div class="actions" style="margin-top:8px"><button class="btn primary sm" data-act="pickAdd">Add selected as lines</button><button class="btn sm" data-act="pickCancel">Cancel</button></div><p class="small muted">Added at cost, before VAT.</p>`;
  };
  let cliOpen=false,cliQ='';
  const lastBilled=c=>S.invoices.filter(x=>x.clientId===c.id).reduce((m,x)=>Math.max(m,x.number||0),0);
  const cliRow=c=>`<button type="button" class="row" role="option" data-act="cliPick" data-id="${c.id}" aria-selected="${c.id===inv.clientId}"><div class="l"><div class="t">${esc(c.name)}</div><div class="s">${esc([c.street,c.city].filter(Boolean).join(', ')||c.email||'No address yet')}</div></div>${c.id===inv.clientId?`<div class="r">${CHECK_SVG}</div>`:''}</button>`;
  const cliListHtml=()=>{
    const q=NORM(cliQ).trim();let h='';
    if(q){
      const l=S.clients.filter(c=>q.split(/\s+/).every(w=>NORM([c.name,c.street,c.zip,c.city,c.email,c.bizId,c.businessId].join(' ')).includes(w))).sort((a,b)=>a.name.localeCompare(b.name,'fi'));
      h=l.length?`<div class="list">${l.map(cliRow).join('')}</div>`:`<p class="small muted" style="margin:8px 2px">No clients match.</p>`;
    }else{
      const rec=S.clients.filter(c=>lastBilled(c)>0).sort((a,b)=>lastBilled(b)-lastBilled(a)).slice(0,5);
      const ids=new Set(rec.map(c=>c.id));
      const rest=S.clients.filter(c=>!ids.has(c.id)).sort((a,b)=>a.name.localeCompare(b.name,'fi'));
      if(rec.length)h+=`<span class="lab" style="display:block;margin:12px 2px 6px">Recently billed</span><div class="list">${rec.map(cliRow).join('')}</div>`;
      if(rest.length)h+=`<span class="lab" style="display:block;margin:12px 2px 6px">${rec.length?'Other clients':'All clients'}</span><div class="list">${rest.map(cliRow).join('')}</div>`;
    }
    return h+`<button type="button" class="itm itadd" data-act="cliNewC"><span class="plus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span>New client</span></button>`;
  };
  const cliPanel=()=>`<div class="cpanel"><div class="srch"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input type="search" id="cq" data-cq value="${esc(cliQ)}" placeholder="Search clients…" aria-label="Search clients" autocomplete="off" enterkeyhint="search"></div><div id="cqList">${cliListHtml()}</div></div>`;
  const openCli=()=>{cliOpen=true;cliQ='';const bx=$('#cliBox',root);bx.innerHTML=cliPanel();const bt=$('#e_client',root);if(bt)bt.setAttribute('aria-expanded','true');const q=$('#cq',root);if(q)q.focus({preventScroll:true});const pn=bx.firstElementChild;if(pn)kbFit(bt,pn);if(pn)setTimeout(()=>pn.scrollIntoView({block:'nearest',behavior:'smooth'}),30)};
  const closeCli=()=>{if(!cliOpen)return;cliOpen=false;const bx=$('#cliBox',root),bt=$('#e_client',root);if(bt)bt.setAttribute('aria-expanded','false');const pn=bx&&bx.firstElementChild;if(!pn)return;pn.classList.add('closing');setTimeout(()=>{if(!cliOpen)bx.innerHTML=''},150)};
  const body=()=>`
    <div class="f cwrap"><label for="e_client">Client</label><button type="button" class="selbtn" id="e_client" data-act="cliOpen" aria-haspopup="listbox" aria-expanded="${cliOpen}"><span class="${client(inv.clientId)?'':'muted'}">${esc((client(inv.clientId)||{}).name||'Choose…')}</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div id="cliBox">${cliOpen?cliPanel():''}</div></div>
    <div class="grid2">
      <div class="f"><label>Invoice date</label><input id="e_issue" type="date" data-e="issueDate" value="${inv.issueDate}"></div>
      <div class="f"><label for="e_due">Payment term</label><select id="e_due" data-e="term">${termOpts(termDays())}</select></div>
      <div class="f"><label for="e_num">Invoice number</label><input id="e_num" inputmode="numeric" data-e="number" value="${inv.number}"></div>
      <div class="f"><label for="e_lang">Language</label><select id="e_lang" data-e="lang"><option value="fi" ${inv.lang==='fi'?'selected':''}>Finnish</option><option value="en" ${inv.lang==='en'?'selected':''}>English</option></select></div>
    </div>
    ${isNew&&S.invoices.length===0?'<p class="small muted" style="margin:-4px 0 12px">This is the first invoice in this account. Set the number if you have invoiced before. Later invoices continue numbering automatically.</p>':''}
    <div class="f"><label for="e_ref">Invoice reference</label><input id="e_ref" required aria-required="true" data-e="yourRef" value="${esc(inv.yourRef)}" placeholder="e.g. Koivukuja 4, ventilation plan"></div>
    <div class="f"><label for="e_notes">Invoice note</label><textarea id="e_notes" data-e="notes" placeholder="Optional, printed on the invoice">${esc(inv.notes)}</textarea></div>
    <h2 style="margin-top:8px">Lines</h2>
    <div id="lines">${inv.lines.map(lineHtml).join('')}</div>
    <div class="actions" style="margin-bottom:6px"><button class="btn" data-act="lnAdd">Add line</button><button class="btn" data-act="pickOpen">Add receipts</button></div>
    <div id="pickBox">${picking?pickHtml():''}</div>
    <h2>Totals</h2><div id="edTotals">${totalsHtml()}</div>
    <div class="f" style="margin-top:14px"><label for="e_inote">Internal note</label><textarea id="e_inote" data-e="inNote" placeholder="Only for you, not shown on the invoice">${esc(inv.inNote||'')}</textarea></div>
    <div class="actions" style="flex-wrap:nowrap"><button class="btn" data-act="invPreview" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Preview</button><button class="btn primary" data-act="invSave" style="flex:2;display:inline-flex;align-items:center;justify-content:center;gap:8px"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3M7 21v-7h10v7"/></svg>Save invoice</button></div>`;
  const UR=d=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
  const sh=openSheet(isNew?'New invoice':'Edit invoice '+inv.number,body,{right:`<span class="urs"><button class="btn sm ur" data-act="invUndo" aria-label="Undo" disabled>${UR('M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3')}</button><button class="btn sm ur" data-act="invRedo" aria-label="Redo" disabled>${UR('M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3')}</button></span>`});
  const root=sh.el;
  const inv0=JSON.stringify(inv);
  root.addEventListener('click',e=>{if(cliOpen&&!e.target.closest('.cwrap'))closeCli()});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&cliOpen){e.stopPropagation();closeCli()}});
  guardLeave(sh,()=>JSON.stringify(inv)!==inv0,tpl?{title:'Discard duplicate?',text:'This duplicate has not been saved. If you go back now, it will be discarded.',yes:'Discard duplicate'}:undefined);
  const redoLines=()=>{$('#lines',root).innerHTML=inv.lines.map(lineHtml).join('');$('#edTotals',root).innerHTML=totalsHtml()};
  root.addEventListener('input',e=>{
    const t=e.target,d=t.dataset;
    if(d.l){const l=inv.lines[+d.i];if(d.l==='desc')l.desc=t.value;if(d.l==='qty')l.qty=toNum(t.value);if(d.l==='price')l.unitCents=toCents(t.value);$('#edTotals',root).innerHTML=totalsHtml()}
    else if(d.e&&['yourRef','notes','inNote','number'].includes(d.e)){inv[d.e]=d.e==='number'?(parseInt(t.value,10)||0):t.value}
    else if(d.e==='term'){const n=Math.max(0,parseInt(t.value,10)||0);inv.dueDate=addDays(inv.issueDate,n);$('#e_dueTxt',root).textContent=dateFi(inv.dueDate)}
  });
  root.addEventListener('change',e=>{
    const t=e.target,d=t.dataset;
    if(d.l){const l=inv.lines[+d.i];if(d.l==='unit')l.unit=t.value;if(d.l==='vat'){l.vatRate=+t.value;$('#edTotals',root).innerHTML=totalsHtml()}}
    else if(d.e==='issueDate'){if(t.value){const n=termDays();inv.issueDate=t.value;inv.dueDate=addDays(t.value,n);$('#e_dueTxt',root).textContent=dateFi(inv.dueDate)}}
    else if(d.e==='lang'){inv.lang=t.value}
  });
  /* undo / redo */
  const snap=()=>JSON.stringify({inv,ed:inv.lines.map(l=>editing.has(l))});
  let hist=[snap()],pos=0,timer=null;
  const syncUR=()=>{const u=root.querySelector('[data-act=invUndo]'),d=root.querySelector('[data-act=invRedo]');if(u)u.disabled=!(pos>0||timer);if(d)d.disabled=pos>=hist.length-1};
  const commit=()=>{clearTimeout(timer);timer=null;const sn=snap();if(sn!==hist[pos]){hist.length=pos+1;hist.push(sn);pos++;if(hist.length>80){hist.shift();pos--}}syncUR()};
  const later=()=>{clearTimeout(timer);timer=setTimeout(commit,600);syncUR()};
  const restore=n=>{const o=JSON.parse(hist[n]);Object.keys(inv).forEach(k=>delete inv[k]);Object.assign(inv,o.inv);editing=new WeakSet();inv.lines.forEach((l,i)=>{if(o.ed[i])editing.add(l)});pos=n;picking=false;root.querySelector('.sheet-body').innerHTML=body();syncUR()};
  root.addEventListener('input',e=>{if(e.target.dataset&&(e.target.dataset.l||e.target.dataset.e))later()});
  root.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.cq!==undefined){cliQ=e.target.value;const l=$('#cqList',root);if(l)l.innerHTML=cliListHtml()}});
  root.addEventListener('change',()=>setTimeout(commit,0));
  root.addEventListener('click',async e=>{
    const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
    if(['lnAdd','lnDone','lnEdit','lnDel','pickAdd','cliPick'].includes(act))setTimeout(commit,0);
    if(act==='cliOpen'){if(cliOpen)closeCli();else openCli();return}
    if(act==='cliPick'){inv.clientId=a.dataset.id;picking=false;const pb=$('#pickBox',root);if(pb)pb.innerHTML='';const sp=$('#e_client span',root),c=client(inv.clientId);if(sp&&c){sp.textContent=c.name;sp.className=''}closeCli();return}
    if(act==='cliNewC'){closeCli();openClient(null,cid=>{inv.clientId=cid;cliOpen=false;root.querySelector('.sheet-body').innerHTML=body()});return}
    if(act==='invUndo'){if(timer)commit();if(pos>0)restore(pos-1);return}
    if(act==='invRedo'){if(pos<hist.length-1)restore(pos+1);return}
    if(act==='lnAdd'){let nl=inv.lines.find(l=>!hasContent(l));if(!nl){nl=blankLine();inv.lines.push(nl)}foldOthers(nl);editing.add(nl);redoLines();const di=inv.lines.indexOf(nl),f=root.querySelector('[data-l=desc][data-i="'+di+'"]');if(f)f.focus({preventScroll:false})}
    if(act==='lnDone'){const l=inv.lines[+a.dataset.i];if(!hasContent(l)){toast('Add a description and price first');return}editing.delete(l);redoLines()}
    if(act==='lnEdit'){const l=inv.lines[+a.dataset.i];foldOthers(l);editing.add(l);redoLines()}
    if(act==='lnDel'){inv.lines.splice(+a.dataset.i,1);redoLines()}
    if(act==='pickOpen'){picking=true;$('#pickBox',root).innerHTML=pickHtml()}
    if(act==='pickCancel'){picking=false;$('#pickBox',root).innerHTML=''}
    if(act==='pickAdd'){
      const ids=[...root.querySelectorAll('[data-pick]:checked')].map(x=>x.dataset.pick);
      ids.forEach(rid=>{const r=S.receipts.find(x=>x.id===rid);if(!r)return;
        const ls=recBillLines(r);
        if(inv.lines.length===1&&!inv.lines[0].desc&&!inv.lines[0].unitCents)inv.lines=ls;else inv.lines.push(...ls)});
      picking=false;root.querySelector('.sheet-body').innerHTML=body();
    }
    if(act==='invPreview'){
      const c=client(inv.clientId);
      if(!c){toast('Choose a client');return}
      if(!(inv.yourRef||'').trim()){toast('Enter an invoice reference');const r=$('#e_ref');if(r)r.focus();return}
      if(!inv.lines.some(l=>l.unitCents>0&&l.desc.trim())){toast('Add a line with a description and price');return}
      const tmp=clone(inv);tmp.lines=tmp.lines.filter(l=>l.desc.trim()||l.unitCents>0);
      tmp.clientSnap={name:c.name,kind:c.kind,bizId:c.bizId||'',street:c.street||'',zip:c.zip||'',city:c.city||'',email:c.email||''};
      tmp.ref=(!inv.ref||(existing&&existing.number!==inv.number))?refNum(inv.number):inv.ref;
      previewInvoice(tmp);return;
    }
    if(act==='invSave'){
      const c=client(inv.clientId);
      if(!c){toast('Choose a client');return}
      if(!inv.number){toast('Enter an invoice number');return}
      if(!(inv.yourRef||'').trim()){toast('Enter an invoice reference');const r=$('#e_ref');if(r)r.focus();return}
      if(!inv.lines.some(l=>l.unitCents>0&&l.desc.trim())){toast('Add a line with a description and price');return}
      if(S.invoices.some(x=>x.id!==inv.id&&x.number===inv.number)){toast('That invoice number is already used');return}
      inv.lines=inv.lines.filter(l=>l.desc.trim()||l.unitCents>0);
      inv.clientSnap={name:c.name,kind:c.kind,bizId:c.bizId||'',street:c.street||'',zip:c.zip||'',city:c.city||'',email:c.email||''};
      if(!inv.ref||(existing&&existing.number!==inv.number))inv.ref=refNum(inv.number);
      a.disabled=true;
      try{
        await save('invoices',inv);
        const keep=new Set(inv.lines.map(l=>l.receiptId).filter(Boolean));
        for(const r of S.receipts){
          if(keep.has(r.id)&&r.billedInvoiceId!==inv.id)await save('receipts',{...r,billedInvoiceId:inv.id});
          else if(!keep.has(r.id)&&r.billedInvoiceId===inv.id)await save('receipts',{...r,billedInvoiceId:''});
        }
        closeSheet();
        if(isNew)showInvoice(inv.id);
        toast('Invoice saved');
      }catch(err){a.disabled=false}
    }
  });
}

      ${(i.inNote||'').trim()?`<li><span>Internal note</span><span class="lead"></span><span class="val" style="white-space:normal;text-align:right">${esc(i.inNote)}</span></li>`:''}
    </ul>

      ${i.lines.map(l=>`<tr><td>${esc(l.desc)}<div class="small muted">${fmtRate(l.vatRate)} % VAT · ${num(l.unitCents)} / ${esc(l.unit)}</div></td><td class="n">${String(l.qty).replace('.',',')} ${esc(l.unit)}</td><td class="n">${num(Math.round(l.qty*l.unitCents))}</td></tr>`).join('')}

    return it.map(([a,l])=>`<button class="si${a==='delAsk'?' danger':''}" role="menuitem" data-act="${a}" data-id="${i.id}"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[a]}</svg><span>${l}</span></button>`).join('')};
  const shareBtn=canShareFiles()?`<button class="btn sm dots shr" data-act="shareInv" data-id="${id}" aria-label="Share">${SHARE_IC}</button>`:'';
  const sh=openSheet('Invoice',body,{live:true,right:`<div style="display:flex;align-items:center;gap:4px">${shareBtn}<div class="sortw"><button class="btn sm dots" data-act="invMenu" aria-label="More actions" aria-haspopup="true" aria-expanded="false">${DOTS}</button><div class="smenu" id="invMenu" role="menu" hidden></div></div></div>`});
  const num0=(S.invoices.find(x=>x.id===id)||{}).number;
  if(num0)sh.el.querySelector('h3').textContent='Invoice '+num0;

    if(mm&&!mm.hidden&&!(a&&a.dataset.act==='invMenu')){mm.hidden=true;const mb=sh.el.querySelector('[data-act=invMenu]');if(mb)mb.setAttribute('aria-expanded','false')}
    if(!a)return;const act=a.dataset.act;

    if(act==='invMenu'){mm.innerHTML=menuHtml(i);mm.hidden=!mm.hidden;a.setAttribute('aria-expanded',String(!mm.hidden));return}
    if(act==='payAsk'){marking=true;refreshTop()}
    if(act==='payNo'){marking=false;refreshTop()}
    if(act==='delAsk'){confirmDel=true;refreshTop()}
    if(act==='delNo'){confirmDel=false;refreshTop()}

      offerAction('Invoice deleted','Undo',async()=>{await save('invoices',origInv);for(const o of origRec)await save('receipts',o);toast('Restored')});
    }
    if(act==='previewInv'){previewInvoice(i)}
    if(act==='shareInv'){shareInvoice(i)}
    if(act==='editInv'){openInvoiceEditor(i.id)}

    }
  });

  });
  root.addEventListener('click',async e=>{
    const a=e.target.closest('[data-act]');if(!a)return;
    if(a.dataset.act==='recOk'){
      if(!r.total){toast('Enter the total');return}

/* split one receipt into two linked parts, each with its own category */
function openSplit(r,done){
  const items=r.items||[],sel=new Set(),orig=clone(r);
  let cat=Object.keys(CATS).find(k=>k!==r.category)||'other';
  const sumOf=a=>a.reduce((t,x)=>t+(x.total||0),0);
  const vatOf=a=>a.reduce((t,x)=>t+vatFrom(x.total||0,+x.vatRate||0),0);
  const mainRate=a=>{const m=a.slice().sort((x,y)=>(y.total||0)-(x.total||0))[0];return m?+m.vatRate||0:+r.vatRate||0};
  const body=()=>`<p class="small muted" style="margin:0 0 8px">${L('Tick the rows that move to a new part and give it a category. The total stays the same.','Valitse rivit, jotka siirretään uuteen osaan, ja anna sille kategoria. Yhteissumma pysyy samana.')}</p>
    <div class="itms">${items.map((x,i)=>`<label class="itm"><input type="checkbox" class="ick" data-sp="${i}" aria-label="${esc((x.desc||'').trim())}"><div class="ib"><div>${esc((x.desc||'').trim())||L('No description','Ei kuvausta')}</div><div class="small muted">${fmtRate(+x.vatRate||0)} % ${L('VAT','ALV')}</div></div><div class="mono">${money(x.total||0)}</div></label>`).join('')}</div>
    <div class="f" style="margin-top:12px"><label for="sp_cat">${L('Category of the new part','Uuden osan kategoria')}</label><select id="sp_cat">${Object.entries(CATS).map(([k,v])=>`<option value="${esc(k)}"${k===cat?' selected':''}>${esc(v)}</option>`).join('')}</select></div>
    <div class="splsum" id="sp_sum"></div>
    <div class="splnote">${L('Both parts share the same receipt file. VAT is calculated for each part.','Molemmat osat käyttävät samaa kuittitiedostoa. ALV lasketaan osille erikseen.')}</div>
    <button class="btn primary" id="sp_go" data-act="spGo" style="width:100%;margin-top:8px" disabled>${L('Split into two parts','Jaa kahteen osaan')}</button>`;
  const sh=openSheet(L('Split receipt','Jaa kuitti'),body),root=sh.el;
  const upd=()=>{
    const mv=items.filter((x,i)=>sel.has(i)),rest=items.filter((x,i)=>!sel.has(i));
    $('#sp_sum',root).innerHTML=`<div><span class="d"><i class="dot"></i>${esc(catName(r.category))}</span><b>${money(sumOf(rest))}</b></div><div><span class="d"><i class="dot t"></i>${esc(catName(cat))}</span><b>${money(sumOf(mv))}</b></div><div class="tot"><span>${L('Total','Yhteensä')}</span><b>${money(sumOf(items))}</b></div>`;
    $('#sp_go',root).disabled=!(mv.length&&rest.length);
  };
  upd();
  root.addEventListener('change',e=>{const t=e.target;
    if(t.dataset&&t.dataset.sp!==undefined){const i=+t.dataset.sp;if(t.checked)sel.add(i);else sel.delete(i);upd()}
    else if(t.id==='sp_cat'){cat=t.value;upd()}});
  root.addEventListener('click',async e=>{
    const a=e.target.closest('[data-act=spGo]');if(!a||a.disabled)return;a.disabled=true;
    const moved=items.filter((x,i)=>sel.has(i)),rest=items.filter((x,i)=>!sel.has(i));
    const grp=S.receipts.filter(x=>x.splitId&&x.splitId===r.splitId);
    const sid=r.splitId||uid(),maxIdx=Math.max(r.splitIdx||1,...grp.map(x=>x.splitIdx||1));
    const part=clone(r);part.id=uid();part.createdAt=Date.now();part.items=clone(moved);part.category=cat;part.splitId=sid;part.splitIdx=maxIdx+1;part.billedInvoiceId='';part.warranty=false;delete part.warrantyEnd;delete part.warrantyYrs;part.fileName='';
    part.total=sumOf(moved);part.vat=vatOf(moved);part.vatRate=mainRate(moved);
    r.items=rest;r.splitId=sid;r.splitIdx=r.splitIdx||1;r.total=sumOf(rest);r.vat=vatOf(rest);r.vatRate=mainRate(rest);
    try{await save('receipts',part);await save('receipts',r)}catch(err){a.disabled=false;return}
    closeSheet();done();
    offerAction(L('Receipt split into two parts','Kuitti jaettu kahteen osaan'),L('Undo','Kumoa'),async()=>{await save('receipts',orig);await drop('receipts',part.id);toast(L('Restored','Palautettu'))});
  });
}
function blankReceipt(){return {id:uid(),items:[],fileName:'',supplier:'',date:todayStr(),total:0,vat:0,vatRate:+S.settings.defVat||25.5,category:isProj()?'other':'materials',clientId:'',docNumber:'',supplierId:'',notes:'',imageId:'',pdfId:'',isPdf:false,status:'review',ocr:false,billedInvoiceId:'',createdAt:Date.now()}}

/* capture and read */
async function prepImage(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const max=1800,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,'image/jpeg',0.82));
    return b||file;
  }catch(e){return file}
}

const OCR_PROMPT=`You read Finnish and English receipts and supplier invoices. The attached image is one receipt or invoice. Reply with only one JSON object:
{"supplier": string, "date": "YYYY-MM-DD" or "", "total": number, "vat": number, "vatRate": number, "docNumber": string, "businessId": string, "category": string, "items": [{"desc": string, "total": number, "vatRate": number}]}
Rules: "total" is the full amount paid including VAT, in euros, with a decimal point. "vat" is the total VAT amount in euros (0 if not shown). "vatRate" is the main VAT percentage on the document (Finland: 25.5 for most goods since September 2024, also 14, 10 or 0). "date" is the purchase or invoice date. "docNumber" is the receipt or invoice number if printed, else "". "businessId" is the SELLER's Finnish business ID (Y-tunnus, format 1234567-8) if printed, else "" (never the buyer's, never a VAT number). "category" is one of: materials, tools, software, vehicle, travel, subcontract, fees, office, other. "items" has one entry per product or service row printed on the document: "desc" is the product name, "total" is what that row cost including VAT in euros (quantity times unit price, after any row discount), "vatRate" is that row's VAT percentage (25.5, 14, 10 or 0; use the main rate if rows do not show one). Include deposit rows as items. If the document has only one product or service row, return it as a single item with its product name in "desc" (never the supplier name). Use [] only if you cannot read any rows. Use "" or 0 for anything you cannot read. Do not guess. If the photo does not show any receipt or invoice, reply only {"noReceipt": true}.`;
async function readReceipt(blob){
  const d=await H.sample.json(ocrPrompt(),{images:blob,modelTier:'default'});
  return (d&&typeof d==='object'&&!Array.isArray(d))?d:{};
}
/* every receipt is filed as a PDF named YYYYMMDD_SUPPLIER */
function recBaseName(r){
  const d=String(r.date||'').replace(/\D/g,'').slice(0,8)||'00000000';
  let v=String(r.supplier||'').replace(/[\\\/:*?"<>|\x00-\x1f]/g,' ').replace(/\s+/g,' ').trim().replace(/[. ]+$/,'').slice(0,60);
  return d+'_'+(v||'Unknown supplier');
}
const cleanName=v=>{const n=String(v||'').replace(/[\\\/:*?"<>|\x00-\x1f]/g,' ').replace(/\s+/g,' ').trim().replace(/\.pdf$/i,'').replace(/[. ]+$/,'').slice(0,100);return n?n+'.pdf':''};
/* same date and supplier: first receipt keeps the plain name, later ones get _2, _3 … ; a name typed by hand wins */
const recFileOut=r=>{const sp=splitInfo(r);return recFileName(sp?sp.g[0]:r)};
function recFileName(r){
  const own=cleanName(r.fileName);if(own)return own;
  const base=recBaseName(r).toLowerCase();
  const same=S.receipts.filter(x=>x.id!==r.id&&!cleanName(x.fileName)&&recBaseName(x).toLowerCase()===base).concat([r])
    .sort((x,y)=>(x.createdAt||0)-(y.createdAt||0)||String(x.id).localeCompare(String(y.id)));
  const n=same.findIndex(x=>x.id===r.id)+1;
  return recBaseName(r)+(n>1?'_'+n:'')+'.pdf';
}
async function imgToPdf(blob){
  const bmp=await createImageBitmap(blob);const w=bmp.width,h=bmp.height;
  const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)});
  const {jsPDF}=window.jspdf;const ratio=h/w;
  const type=/^data:image\/png/.test(url)?'PNG':'JPEG';
  /* page takes the image's own proportions, image fills it edge to edge (no white borders) */
  const ph=Math.min(5000,Math.max(60,210*ratio));
  const doc=new jsPDF({unit:'mm',format:[210,ph],orientation:ph>210?'p':'l'});
  doc.addImage(url,type,0,0,210,ph);return doc.output('blob');
}
async function recPdfBlob(r){
  const fid=r.pdfId||(r.isPdf?r.imageId:'');
  if(fid){const res=await fetch('/_blob/'+fid);if(res.ok)return await res.blob()}
  if(r.imageId&&!r.isPdf){const res=await fetch('/_blob/'+r.imageId);if(res.ok)return await imgToPdf(await res.blob())}
  return null;
}
/* Finnish business ID: 7 digits, dash, check digit; returns normalised text or '' */
function fixYtunnus(v){
  const m=String(v==null?'':v).match(/(\d{7})\s*-?\s*(\d)/);if(!m)return '';
  const w=[7,9,10,5,8,4,2];let sum=0;for(let i=0;i<7;i++)sum+=w[i]*(+m[1][i]);
  const rem=sum%11;if(rem===1)return '';
  const chk=rem===0?0:11-rem;
  return chk===+m[2]?m[1]+'-'+m[2]:'';
}
function buildReceipt(d,imageId,isPdf,pdfId){
  const r=blankReceipt();r.imageId=imageId||'';r.isPdf=!!isPdf;r.pdfId=pdfId||(isPdf?imageId:'')||'';
  const has=d&&Object.keys(d).length>0;r.ocr=!!has;
  if(has){
    r.supplier=String(d.supplier||'').slice(0,120);
    if(/^\d{4}-\d{2}-\d{2}$/.test(d.date||''))r.date=d.date;
    r.total=toCents(+d.total||0);
    const rate=+d.vatRate;r.vatRate=VATS.includes(rate)?rate:(+S.settings.defVat||25.5);
    const v=toCents(+d.vat||0);r.vat=(v>0&&v<r.total)?v:vatFrom(r.total,r.vatRate);
    r.docNumber=String(d.docNumber||'').slice(0,60);
    r.supplierId=fixYtunnus(d.businessId);
    r.category=CATS[d.category]?d.category:'other';
    if(Array.isArray(d.items)){
      r.items=d.items.slice(0,80).filter(x=>x&&typeof x==='object').map(x=>({id:uid(),desc:String(x.desc||'').slice(0,120),total:toCents(+x.total||0),vatRate:VATS.includes(+x.vatRate)?+x.vatRate:r.vatRate,incl:true})).filter(x=>x.desc||x.total);
      if(r.items.length===1){r.items[0].total=r.total;r.items[0].vatRate=r.vatRate}
    }
  }
  return r;
}
/* invoice lines for a receipt billed to a client: ticked items only, one line per VAT rate */
function recBillLines(r){
  const desc=(r.supplier||'Materials')+' '+dateFi(r.date);
  const it=(r.items||[]).filter(x=>x.incl!==false&&(x.total||0)>0);
  const all=r.items||[];
  const rates=[...new Set(it.map(x=>+x.vatRate||0))];
  if(all.length&&(it.length!==all.length||rates.length>1)){
    return rates.map(rate=>{
      const gross=it.filter(x=>(+x.vatRate||0)===rate).reduce((t,x)=>t+x.total,0);
      return {desc:desc+(rates.length>1?' (VAT '+fmtRate(rate)+' %)':''),qty:1,unit:'pcs',unitCents:gross-vatFrom(gross,rate),vatRate:rate,receiptId:r.id};
    });
  }
  return [{desc,qty:1,unit:'pcs',unitCents:r.total-(r.vat||0),vatRate:+r.vatRate||0,receiptId:r.id}];
}
/* what a receipt counts as an expense: unticked items are left out */
/* VAT amounts per rate for what a receipt counts as expense (rounding difference goes to the largest row) */
function recVatByRate(r){
  const it=r.items||[],tot=recExp(r).vat,m={};
  const part=it.length&&!it.every(x=>x.incl!==false);
  if(it.length&&(part||it.some(x=>+x.vatRate!==+it[0].vatRate)))it.filter(x=>x.incl!==false).forEach(x=>{const k=+x.vatRate||0;m[k]=(m[k]||0)+vatFrom(x.total||0,k)});
  else m[+r.vatRate||0]=tot;
  const ks=Object.keys(m),sum=ks.reduce((t,k)=>t+m[k],0);
  if(ks.length&&sum!==tot){const big=ks.sort((a,b)=>m[b]-m[a])[0];m[big]+=tot-sum}
  return m;
}
function recExp(r){
  const it=r.items||[];
  if(!it.length||it.every(x=>x.incl!==false))return {gross:r.total||0,vat:r.vat||0};
  const inc=it.filter(x=>x.incl!==false);
  return {gross:inc.reduce((t,x)=>t+(x.total||0),0),vat:inc.reduce((t,x)=>t+vatFrom(x.total||0,+x.vatRate||0),0)};
}
async function processFiles(files){
  if(!files.length)return;
  if(trialStop()||trialFull('scan'))return;
  S.filter.rec='open';if(S.tab!=='receipts')go('receipts');
  for(const f of files){
    if(trialFull('scan'))break;
    if(trialRun()){S.gen.trialScans=trialScans()+1;saveGen()}
    const q={id:uid(),name:f.name||'Photo',state:'working',msg:'Preparing…',pct:8};S.queue.unshift(q);renderQueue();let creep=null;
    try{
      const isPdf=f.type==='application/pdf';
      const blob=isPdf?f:await prepImage(f);
      let imageId='',pdfId='';
      const upl=async(b,type)=>{for(let k=0;k<2;k++){try{return (await H.assets.upload(b,{type})).id}catch(e){}}return ''};
      if(H.assets){
        q.msg='Saving…';q.pct=20;renderQueue();
        imageId=await upl(blob,isPdf?'application/pdf':(blob.type==='image/png'?'image/png':'image/jpeg'));
        if(!isPdf&&imageId&&window.jspdf){
          try{const pb=await imgToPdf(blob);pdfId=await upl(pb,'application/pdf')}catch(e){}
        }
      }
      q.pct=45;
      if(!imageId)q.warn='The file could not be stored. Check the details and keep the paper receipt.';
      let data={};
      let ocrIn=blob;
      if(isPdf&&H.sample&&S.ocr){q.msg='Reading…';q.pct=50;renderQueue();try{ocrIn=await pdfToImage(blob)}catch(e){ocrIn=null}}
      if(ocrIn&&H.sample&&S.ocr){
        q.msg='Reading…';q.pct=55;renderQueue();
        creep=setInterval(()=>{q.pct+=(92-q.pct)*0.07;renderQueue()},600);
        try{data=await readReceipt(ocrIn);if(isPdf&&data.noReceipt)data={}}
        catch(e){
          if(['not_granted','sampling_disabled','images_unavailable','not_declared','capability_disabled','capability_removed'].includes(e&&e.code)){S.ocr=false}
          q.note=e&&e.code;
          if(e&&e.message&&['scan_limit','trial_over'].includes(e.code))q.warn=e.message;
        }
      }
      clearInterval(creep);q.pct=95;
      const none=!isPdf&&H.sample&&S.ocr&&!q.note&&(data.noReceipt===true||(!String(data.supplier||'').trim()&&!(+data.total>0)&&!(Array.isArray(data.items)&&data.items.length)));
      if(none){data={};q.none=true;if(!q.warn)q.warn='No receipt found in the photo. Please\u00a0try\u00a0again.'}
      const r=buildReceipt(data,imageId,isPdf,pdfId);if(none)r.noReceipt=true;
      if(!none)await save('receipts',r);
      if(none){toast('No receipt found in the photo. Please try again.',6500);try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}}
      q.state='done';q.msg=q.warn?q.warn:r.ocr?(r.supplier?r.supplier+' · '+money(r.total):'Added, please check'):'Added, fill in details';
      if(!q.warn&&r.ocr&&r.supplier){q.sup=r.supplier;q.amt=money(r.total)}
      if(!q.warn)setTimeout(()=>{q.out=true;renderQueue();setTimeout(()=>{S.queue=S.queue.filter(x=>x!==q);renderQueue()},400)},5000);
    }catch(e){clearInterval(creep);q.state='error';q.msg='Failed'}
    renderQueue();
  }
}

function code128C(digits){
  const vals=[];for(let i=0;i<digits.length;i+=2)vals.push(+digits.slice(i,i+2));
  let sum=105;vals.forEach((v,i)=>{sum+=v*(i+1)});
  return [105].concat(vals,[sum%103,106]).map(v=>C128[v]).join('');
}
function vbString(inv,t,s){
  const iban=String(s.iban||'').replace(/\s/g,'').toUpperCase();
  if(!/^FI\d{16}$/.test(iban))return '';
  if(!(t.gross>0)||Math.floor(t.gross/100)>999999)return '';
  const ref=String(invRef(inv)).replace(/\D/g,'');
  if(!ref||ref.length>20)return '';
  const d=inv.dueDate||'';
  const due=/^\d{4}-\d{2}-\d{2}$/.test(d)?d.slice(2,4)+d.slice(5,7)+d.slice(8,10):'000000';
  const out='4'+iban.slice(2)+String(Math.floor(t.gross/100)).padStart(6,'0')+String(t.gross%100).padStart(2,'0')+'000'+ref.padStart(20,'0')+due;
  return out.length===54?out:'';
}

/* PDF receipts: page images for reading, preview and list thumbnails (pdf.js) */
async function pdfRender(blob,maxPages,W,q){
  const lib=await loadPdfjs();const doc=await lib.getDocument({data:await blob.arrayBuffer()}).promise;
  const cvs=[];
  for(let k=1;k<=Math.min(doc.numPages,maxPages);k++){
    const pg=await doc.getPage(k);const v0=pg.getViewport({scale:1});const sc=W/v0.width;
    const cv=document.createElement('canvas');cv.width=W;cv.height=Math.max(1,Math.round(v0.height*sc));
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:ctx,viewport:pg.getViewport({scale:sc})}).promise;cvs.push(cv);
  }
  return cvs;
}
const toJpg=(cv,q)=>new Promise(res=>cv.toBlob(res,'image/jpeg',q||.85));
async function pdfToImage(blob){
  const cvs=await pdfRender(blob,2,1400);
  const out=document.createElement('canvas');out.width=1400;out.height=cvs.reduce((t,c)=>t+c.height,0);
  const ctx=out.getContext('2d');let y=0;cvs.forEach(c=>{ctx.drawImage(c,0,y);y+=c.height});
  const b=await toJpg(out,.85);if(!b)throw new Error('img');return b;
}

async function saveFile(name,data){
  if(!H.dl){toast('Saving files is not available in this view');return}
  try{const r=await H.dl.save({filename:name,data});if(r&&r.status==='saved')toast('Saved '+name)}

const csvCell=v=>{v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const csvNum=c=>(c/100).toFixed(2).replace('.',',');
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=-1;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^-1)>>>0};
async function zipBlob(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const d=new Date(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const data=new Uint8Array(await f.blob.arrayBuffer()),nm=enc.encode(f.name),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);
    parts.push(lh,nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(ch,nm);off+=30+nm.length+data.length;
  }
  const csize=cen.reduce((t,x)=>t+x.byteLength,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,csize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end],{type:'application/zip'});
}

/* accountant package: one zip with receipt PDFs, invoice PDFs and a CSV list of each, for a chosen period */
const MON_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function pkgOptions(){
  const t=new Date(),y=t.getFullYear(),o=[],lm=new Date(y,t.getMonth()-1,1);
  o.push(['m:'+y+'-'+pad(t.getMonth()+1),'This month ('+MON_EN[t.getMonth()]+')']);

  for(let k=0;k<=6;k++)if(k===0||has.has(y-k))o.push(['y:'+(y-k),k===0?'This year ('+y+')':k===1?'Last year ('+(y-1)+')':String(y-k)]);
  o.push(['all','Everything'],['custom','Custom…']);
  return o;
}
const pkgDefault=()=>pkgOptions()[1][0];
const lastDay=ym=>{const [y,m]=ym.split('-').map(Number);return ym+'-'+pad(new Date(y,m,0).getDate())};

function pkgRange(v){

async function accountantPackage(v){

/* ---------- photo zoom ---------- */
function openZoom(src){
  const w=document.createElement('div');w.className='zoomov';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-label','Receipt photo');
  w.innerHTML='<button class="zclose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><img alt="Receipt photo" draggable="false">';
  const img=w.querySelector('img');img.src=src;
  document.body.appendChild(w);
  let sc=1,x=0,y=0,moved=false,lastTap=0,startD=0,startS=1;const pts=new Map();let prev=null,downAt=0;
  const apply=(anim)=>{img.style.transition=anim?'transform .22s ease':'none';img.style.transform='translate('+x+'px,'+y+'px) scale('+sc+')'};
  const clamp=()=>{
    if(sc<=1){x=0;y=0;return}
    const mx=Math.max(0,(img.offsetWidth*sc-innerWidth)/2),my=Math.max(0,(img.offsetHeight*sc-innerHeight)/2);
    x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));
  };
  const zoomAt=(px,py,ns)=>{
    ns=Math.max(1,Math.min(6,ns));
    const cx=innerWidth/2,cy=innerHeight/2;
    const ix=(px-cx-x)/sc,iy=(py-cy-y)/sc;
    x=px-cx-ix*ns;y=py-cy-iy*ns;sc=ns;clamp();
  };
  const close=()=>{document.removeEventListener('keydown',onKey,true);w.remove()};
  const onKey=e=>{if(e.key==='Escape'){e.stopPropagation();e.preventDefault();close()}};
  document.addEventListener('keydown',onKey,true);
  w.querySelector('.zclose').addEventListener('click',e=>{e.stopPropagation();close()});
  const dist=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
  const mid=()=>{const a=[...pts.values()];return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}};
  w.addEventListener('pointerdown',e=>{
    if(e.target.closest('.zclose'))return;
    try{w.setPointerCapture(e.pointerId)}catch(er){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){moved=false;downAt=Date.now();prev={x:e.clientX,y:e.clientY}}
    if(pts.size===2){startD=dist();startS=sc;moved=true}
  });
  w.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    const old=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2){const m=mid();zoomAt(m.x,m.y,startS*dist()/startD);apply();return}
    const dx=e.clientX-old.x,dy=e.clientY-old.y;
    if(Math.hypot(e.clientX-prev.x,e.clientY-prev.y)>8)moved=true;
    if(sc>1){x+=dx;y+=dy;clamp();apply()}
  });
  const up=e=>{
    if(!pts.has(e.pointerId))return;
    pts.delete(e.pointerId);
    if(pts.size===0&&!moved&&Date.now()-downAt<350){
      const now=Date.now();
      if(now-lastTap<320){lastTap=0;if(sc>1){sc=1;x=0;y=0}else zoomAt(e.clientX,e.clientY,2.6);apply(true)}
      else{lastTap=now;if(e.target===w&&sc===1)setTimeout(()=>{if(lastTap===now&&w.isConnected)close()},330)}
    }
    if(pts.size===1){const r=[...pts.values()][0];prev={x:r.x,y:r.y};startS=sc}
    if(sc<1.02&&pts.size===0){sc=1;x=0;y=0;apply(true)}
  };
  w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up);
  w.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,sc*(e.deltaY<0?1.18:1/1.18));apply()},{passive:false});
  w.querySelector('.zclose').focus({preventScroll:true});
}

  renderAcctBar();render();startI18n();
  const use=n=>(window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null));
  slowT=setTimeout(()=>{if(!S.loaded){S.slow=true;scheduleRender()}},10000);
  const [db,assets,sample,dl]=await Promise.all([use('db'),use('assets'),use('sample'),use('downloads')]);
  H.db=db;H.assets=assets;H.sample=sample;H.dl=dl;
  if(sample){try{const l=await sample.limits();S.ocr=!!(l&&l.images)}catch(e){}}
  if(!db){
    clearTimeout(slowT);S.mode='local';
    try{const l=JSON.parse(localStorage.getItem(LS+'-accts')||'null');if(Array.isArray(l))S.accounts=l}catch(e){}
    if(!S.accounts.some(a=>a.id===S.acct))S.acct=S.accounts.length?S.accounts[0].id:'';
    if(S.acct)loadLocal();else enterNone();S.loaded=true;S.genLoaded=true;renderAcctBar();scheduleRender();return;
  }
  S.mode='db';
  db.doc('meta/accounts').onSnapshot(sn=>{
    if(sn.exists){
      const l=(clone(sn.data()).list||[]).filter(x=>x&&x.id);
      S.accounts=l;S.accountsLoaded=true;
      const cur=S.accounts.find(x=>x.id===S.acct);
      if(cur&&S.settings.bizName&&cur.name!==S.settings.bizName){cur.name=S.settings.bizName;saveAccounts()}
      if(!cur){S.acct=S.accounts.length?S.accounts[0].id:'';try{localStorage.setItem('innotate-books-acct',S.acct)}catch(e){}if(S.acct)subscribeAccount();else{enterNone();scheduleRender()}}
    }
    renderAcctBar();
  },()=>{});
  db.doc('meta/general').onSnapshot(sn=>{
    S.genLoaded=true;
    if(sn.exists){const act=document.activeElement;const typing=act&&act.dataset&&act.dataset.gc;const wf=isFi();S.gen={theme:'auto',lang:'',cats:null,ui:'fi',...clone(sn.data())};applyTheme();if(isFi()!==wf)applyLang();if(!typing)applyCats();try{localStorage.setItem(GEN_KEY,JSON.stringify(S.gen))}catch(e){}scheduleRender()}
    else if(S.gen.setupDone){S.gen={theme:'auto',lang:'',cats:null,ui:S.gen.ui||'fi'};try{localStorage.removeItem(GEN_KEY)}catch(e){}setupShown=false;scheduleRender()}
    else if(S.gen.cats||S.gen.theme!=='auto'||S.gen.lang)saveGen();
  },()=>{});
  if(S.acct)subscribeAccount();
}

async function setupFinish(skip){
  if(!setupSh)return;
  const proj=S.gen.profileType==='project',wasSub=setupMode==='sub';
  if(!(S.settings.bizName||'').trim()){toast(proj?'Enter a project name':'Enter your business name');const i=$('#u_bizName');if(i)i.focus();return}
  if(!skip){if(proj)S.settings.type='project';else delete S.settings.type}
  if(!skip&&!proj&&!ibanOk(S.settings.iban)){updIbanErr();toast(TT2('Enter a valid IBAN'),4000);const i=$('#u_iban');if(i)i.focus();return}
  if(!skip&&String(S.settings.iban||'').trim())S.settings.iban=fmtIban(String(S.settings.iban).toUpperCase());
  setupSh=null;document.body.classList.remove('in-setup');
  if(!S.settings.bizName&&setupBackup)S.settings.bizName=setupBackup.bizName;
  if(!S.settings.web&&skip&&setupBackup)S.settings.web=setupBackup.web;
  S.gen.setupDone=true;
  if(setupFresh&&!S.gen.trialStart){S.gen.trialStart=Date.now();S.gen.trialScans=0;S.gen.trialInvIds=[]}
  setupFresh=false;
  closeSheet();
  await saveGen();
  if(!skip)await saveSettings();
  if(!skip&&wasSub){S.subPlan=proj?'projects':'business';ACT.subOpen()}
  else if(S.tab!=='home')go('home',true);else scheduleRender();
  window.scrollTo(0,0);
}
function maybeSetup(){if(setupShown||!setupNeeded())return;setupShown=true;setupFresh=true;setTimeout(openSetup,0)}

/* date rollover: when the day (and so month/year) changes while the app stays open, refresh the views */
let dayKey=todayStr();
const dayCheck=()=>{const k=todayStr();if(k===dayKey)return;dayKey=k;scheduleRender()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayCheck()});
window.addEventListener('focus',dayCheck);window.addEventListener('pageshow',dayCheck);
setInterval(dayCheck,60000);

/* ---------- styled dropdowns: every plain <select> gets the same panel style as the client picker ---------- */
(function(){
  const CHEV='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',CHK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const vd=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
  const sync=sel=>{const w=sel._dd;if(!w)return;const o=sel.options[sel.selectedIndex],sp=w.querySelector('.selbtn span'),b=w.querySelector('.selbtn');const t=o?o.textContent:'';if(sp.textContent!==t)sp.textContent=t;if(b.disabled!==sel.disabled)b.disabled=sel.disabled};
  Object.defineProperty(HTMLSelectElement.prototype,'value',{get(){return vd.get.call(this)},set(v){vd.set.call(this,v);sync(this)},configurable:true});
  const closeAll=except=>{document.querySelectorAll('.ddw.open').forEach(w=>{if(w===except)return;w.classList.remove('open');const b=w.querySelector('.selbtn');if(b)b.setAttribute('aria-expanded','false');const bx=w.querySelector('.ddbox'),pn=bx&&bx.firstElementChild;if(pn){pn.classList.add('closing');setTimeout(()=>{if(!w.classList.contains('open'))bx.innerHTML=''},150)}})};
  const open=(sel,w)=>{
    closeAll(w);
    const bx=w.querySelector('.ddbox');
    bx.innerHTML='<div class="cpanel" role="listbox"><div class="list">'+[...sel.options].map((o,i)=>'<button type="button" class="row" role="option" data-i="'+i+'" aria-selected="'+(i===sel.selectedIndex)+'"><div class="l"><div class="t">'+esc(o.textContent)+'</div></div>'+(i===sel.selectedIndex?'<div class="r">'+CHK+'</div>':'')+'</button>').join('')+'</div></div>';
    w.classList.add('open');w.querySelector('.selbtn').setAttribute('aria-expanded','true');
    const pn=bx.firstElementChild,sl=pn.querySelector('[aria-selected=true]');
    if(sl)pn.scrollTop=Math.max(0,sl.offsetTop-pn.clientHeight/2+sl.offsetHeight/2);
    setTimeout(()=>pn.scrollIntoView({block:'nearest',behavior:'smooth'}),30);
  };
  const enhance=sel=>{
    if(sel._dd)return;
    const w=document.createElement('div');w.className='ddw';if(sel.hasAttribute('data-notr'))w.setAttribute('data-notr','');
    w.innerHTML='<button type="button" class="selbtn" aria-haspopup="listbox" aria-expanded="false"><span></span>'+CHEV+'</button><div class="ddbox"></div>';
    const lb=sel.getAttribute('aria-label');if(lb)w.querySelector('.selbtn').setAttribute('aria-label',lb);
    sel.parentNode.insertBefore(w,sel);sel.style.display='none';sel._dd=w;sync(sel);
    w.addEventListener('click',e=>{
      const b=e.target.closest('.selbtn');
      if(b){if(sel.disabled)return;if(w.classList.contains('open'))closeAll();else open(sel,w);return}
      const r=e.target.closest('.row[data-i]');
      if(r){const i=+r.dataset.i;closeAll();if(i!==sel.selectedIndex){sel.selectedIndex=i;sync(sel);sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}))}}
    });
    w.addEventListener('keydown',e=>{if(e.key==='Escape'&&w.classList.contains('open')){e.stopPropagation();closeAll()}});
  };
  const scan=()=>{document.querySelectorAll('select').forEach(sel=>{if(!sel._dd)enhance(sel);else if(!sel._dd.isConnected){sel._dd=null;enhance(sel)}else sync(sel)})};
  let pend=false;
  const later=()=>{if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;scan()})};
  new MutationObserver(later).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  document.addEventListener('click',e=>{if(!e.target.closest('.ddw'))closeAll()},true);
  scan();
})();

(function(){
  let D=null;
  document.addEventListener('pointerdown',e=>{
    const g=e.target.closest&&e.target.closest('.grip[data-drag]');if(!g||(e.pointerType==='mouse'&&e.button!==0))return;
    e.preventDefault();
    const row=g.closest('.catrow'),box=row.parentNode,rows=[...box.querySelectorAll(':scope > .catrow')];
    const movable=rows.filter(r=>r.dataset.row!=='other'),from=movable.indexOf(row);
    const tops=rows.map(r=>r.getBoundingClientRect().top),step=rows.length>1?tops[1]-tops[0]:row.offsetHeight+8;
    D={g,row,rows:movable,from,to:from,y0:e.clientY,step,kind:g.dataset.drag,id:e.pointerId};
    try{g.setPointerCapture(e.pointerId)}catch(x){}
    movable.forEach(r=>{if(r!==row)r.classList.add('shift')});row.classList.add('drag');
  });
  document.addEventListener('pointermove',e=>{
    if(!D||e.pointerId!==D.id)return;e.preventDefault();
    const n=D.rows.length;let dy=e.clientY-D.y0;
    dy=Math.max(-D.from*D.step,Math.min((n-1-D.from)*D.step,dy));
    D.row.style.transform='translateY('+dy+'px)';
    const to=Math.max(0,Math.min(n-1,D.from+Math.round(dy/D.step)));D.to=to;
    D.rows.forEach((r,i)=>{if(r===D.row)return;let o=0;if(D.from<to&&i>D.from&&i<=to)o=-D.step;else if(D.from>to&&i<D.from&&i>=to)o=D.step;r.style.transform=o?'translateY('+o+'px)':''});
  },{passive:false});
  const end=e=>{
    if(!D||e.pointerId!==D.id)return;const d=D;D=null;
    try{d.g.releasePointerCapture(d.id)}catch(x){}
    d.rows.forEach(r=>{r.classList.remove('shift','drag');r.style.transform=''});
    if(d.to===d.from||e.type==='pointercancel')return;
    if(d.kind==='bud'){const ids=d.rows.map(r=>r.dataset.row),mv=ids.splice(d.from,1)[0];ids.splice(d.to,0,mv);if(BUD_REORDER)BUD_REORDER(ids);return}
    const cat=d.kind==='cat',l=cat?catList():unitList(),ids=d.rows.map(r=>r.dataset.row),mv=ids.splice(d.from,1)[0];ids.splice(d.to,0,mv);
    const by={};l.forEach(x=>by[x.id]=x);const out=ids.map(i=>by[i]).filter(Boolean);l.forEach(x=>{if(!ids.includes(x.id))out.push(x)});
    if(cat){S.gen[catKey()]=out;applyCats()}else S.gen.units=out;saveGen();render();
  };
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
})();

/* tapping a field's label text must not focus the field (keyboard opens only when the field itself is tapped) */
document.addEventListener('click',e=>{
  const l=e.target.closest&&e.target.closest('label');if(!l)return;
  const c=l.control;if(!c||c===e.target||c.contains(e.target))return;
  if(e.target.closest('input,select,textarea,button,a'))return;
  if(c.tagName==='TEXTAREA'||c.tagName==='SELECT'||(c.tagName==='INPUT'&&!['checkbox','radio','file','button','submit'].includes(c.type)))e.preventDefault();
},true);

window.addEventListener('kuititon-toast',e=>toast(e.detail));
boot();
})();
